version: "3.8"

services:
  taskboard-frontend:
    build:
      context: .
      dockerfile: dockerfile
      args:
        NODE_VERSION: 22-alpine
    container_name: taskboard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Tambahkan environment variables lainnya sesuai kebutuhan
      # - NEXT_PUBLIC_API_URL=http://your-api-url
      # - API_BASE_URL=http://your-backend-service
    # Jika butuh file .env, uncomment baris di bawah
    # env_file:
    #   - .env.production
    networks:
      - taskboard-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Jika butuh volume untuk persistent data
    # volumes:
    #   - ./data:/app/data

networks:
  taskboard-network:
    driver: bridge
